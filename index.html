<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Night of the Snapdragon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a0b2e'/%3E%3Ccircle cx='16' cy='12' r='8' fill='%234cc957'/%3E%3Crect x='13' y='18' width='6' height='10' fill='%233fae4a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game-wrap">
  <div id="screen-wrap">
    <canvas id="screen" width="640" height="400"></canvas>
    <div id="title-overlay">
      <h1>NIGHT<br>of the<br>SNAPDRAGON</h1>
      <p class="subtitle">a tentacle-style adventure</p>
      <button id="start-btn">CLICK TO START</button>
      <p class="hint">Voice speech, music &amp; sound effects — turn your volume up!</p>
    </div>
    <div id="ending-overlay" class="hidden">
      <h1>THE END</h1>
      <p id="ending-text"></p>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>
  <div id="control-column">
    <div id="sentence-line">Walk to</div>
    <div id="panel">
      <div id="verbs"></div>
      <div id="inventory"></div>
      <div id="options">
        <button id="mute-music" title="Toggle music">MUSIC: ON</button>
        <button id="mute-voice" title="Toggle voice speech">VOICE: ON</button>
      </div>
    </div>
    <div id="dialog-panel" class="hidden"></div>
  </div>
</div>
<script src="js/audio.js"></script>
<script src="js/speech.js"></script>
<script src="js/art.js"></script>
<script src="js/engine.js"></script>
<script src="js/gamedata.js"></script>
</body>
</html>
